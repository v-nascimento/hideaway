# Pushing a version tag (e.g. 0.3.0) builds the plugin and creates a draft release
# with main.js, manifest.json and styles.css. Review the draft, then publish it.
name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No dependency cache: a release builds from a clean install.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check versions and debug log
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME;
            const m = require("./manifest.json"), p = require("./package.json"), v = require("./versions.json");
            const errors = [];
            if (m.version !== tag) errors.push(`manifest.json says ${m.version}`);
            if (p.version !== tag) errors.push(`package.json says ${p.version}`);
            if (v[tag] !== m.minAppVersion) errors.push(`versions.json["${tag}"] should be ${m.minAppVersion}`);
            if (errors.length) { console.error(`Tag ${tag}: ${errors.join("; ")}`); process.exit(1); }
          '
          grep -q "const DEBUG_LOG = false;" src/main.ts || { echo "DEBUG_LOG must be false in a release"; exit 1; }

      - run: npm ci
      - run: npm run build

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --draft --title "$GITHUB_REF_NAME" --generate-notes
